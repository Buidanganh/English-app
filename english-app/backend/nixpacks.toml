[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "node scripts/bootstrap-sqlite-db.js && npm run build && npx prisma db push && node dist/main"

[variables]
NODE_ENV = "production"
